# ~/.config/hosts/<host>/host.conf — a machine's declaration.
#
# One directory per machine under ~/.config/hosts/, named for the machine it
# declares: ~/.local/bin/host-apply reads `hostnamectl --static` and opens the
# directory of that name, refusing — and naming the directories that do exist —
# when there is none. The name belongs to the machine, so the tracked directory
# carries the placeholder name HOSTNAME and this machine's name is a local
# symlink to it, created by .github/scripts/dotfiles-install.sh and ignored by
# git because it holds no content of its own. Renaming the tracked directory
# means renaming that link.
#
# Read by ~/.local/bin/host-apply, which enables the units listed below and
# installs the files under root/ at the absolute paths they mirror. One
# directory per machine under ~/.config/hosts/; a host's file never refers to
# another host's, so a machine's whole directory can differ without either
# file knowing about the other.
#
# Sections (a full-line `#` or `;` comment is the only comment form):
#   [units-user]    one unit to `systemctl --user enable`, named in full
#   [units-system]  one unit to `sudo systemctl enable`, named in full
#   [roots]         <path relative to root/> = <octal mode>; installed to /<path>
#   [notes]         free text printed by host-apply; no effect on the plan

# The units this machine enabled deliberately. The repository carries the unit
# files this machine declares itself, but not their enablement links, so this list
# is the only record of what a rebuild must re-enable; the shell's own units are
# not carried here and arrive with that project's setup.sh. Units that are
# installed but deliberately off are recorded in [notes] instead of being enabled
# here, and [notes] also names the units this machine has enabled without being
# listed above.
[units-user]
tinshell-shell.service
tinshell-warm.service
auto-rotate.service
awww-daemon.service
wallpapers-apply.service
wallpaper-cycle.timer
pi-patch-apply.path
pi-patch-apply.service
mpris-proxy.service

[units-system]
bluetooth-disable-before-sleep.service
tlp-pd.service

# Root-scoped sources. These cannot be committed at their real /etc or
# /usr/local paths, so they live here and host-apply installs them. The path is
# relative to this host's root/ directory and mirrors the destination.
[roots]
etc/systemd/system/bluetooth-disable-before-sleep.service = 0644
etc/systemd/logind.conf.d/10-inhibit-delay.conf = 0644
usr/local/sbin/bt-sleep.sh = 0755
etc/default/grub.d/50-house-boot.cfg = 0644
usr/local/src/tinshell-splash/mark.svg = 0644
boot/grub/themes/house/theme.txt = 0644
etc/dracut-uki/uki.conf = 0644
etc/dracut-uki/cmdline = 0644
etc/tlp.d/10-house-profile.conf = 0644
etc/pacman.d/hooks/95-uki-rebuild.hook = 0644
usr/local/sbin/uki-rebuild = 0755
efi/grub/bgrt-splash.bmp = 0644

[notes]
auto-rotate.service is this machine's convertible rotation: it drives the accelerometer (iio-sensor-proxy) and the SW_TABLET_MODE switch, so a machine without those devices must not enable it.
tinshell-shell.service and tinshell-warm.service are also installed and enabled by /home/tinoy/dev/tinshell/setup.sh, which owns the tinshell units; either path enables them.
Installed here but deliberately NOT enabled: amdgpu-watch.service, tinshell-promptd.service, tinshell-portal.service, tinshell-polkit.service. tinshell-islands-fallback.service is static — it is tinshell-shell.service's OnFailure target and is never enabled directly.
No swaync unit is installed or masked here: the notifications surface owns org.freedesktop.Notifications, so a packaged notification daemon is neither wanted nor present, and nothing reserves that unit name. The masked system unit nvidia-powerd.service is outside this declaration.
pi-patch-apply.path and pi-patch-apply.service are enabled, but the applier script and the npm tree they act on live under ~/.pi/, which the repository does not carry: on a restored machine the units exist and fail until that tooling is restored.
wallpapers-apply.service and wallpaper-cycle.timer depend on awww-daemon.service; wallpaper-cycle.service is static and is pulled in by the timer.
The two root-scoped pieces above are specific to this machine: the Bluetooth before-sleep service preserves the radio's powered state across suspend, and the logind drop-in raises InhibitDelayMaxSec so the session lock lands before suspend.
The boot screen's own files are not declared here: the splash program, its dracut module, its two units, its dracut drop-ins and tinshell-boot-refresh live in the tinshell tree under apps/greeter/boot/ and are installed by that app's install.sh, which also rebuilds the images. What this machine declares is what is specific to it — the mark the splash draws (usr/local/src/tinshell-splash/mark.svg, the distribution's own artwork, kept here rather than in the shell's tree), the GRUB theme for its menu (boot/grub/themes/house/theme.txt, rendered from the house palette, with its template beside it uninstalled so a palette bump leaves it stale until it is rendered again), the drop-in that hides the menu behind a zero-second timeout and names the menu font (etc/default/grub.d/50-house-boot.cfg), and the unified kernel image's own configuration and command line under etc/dracut-uki/. The firmware's ProArt frame is the one picture nothing can derive from a vector, so it is kept on the ESP and cropped unaltered by tinshell-boot-refresh, which paints the splash's images and reduces them to the raw RGBA the program reads, generates the menu font onto the ESP, then rebuilds the initramfs through dracut-rebuild, the unified kernel image through uki-rebuild and the menu through grub-mkconfig. A normal boot shows the font and not the theme: a zero-second hidden timeout makes grub return the default entry without initialising its view, so the menu is drawn only when it is interrupted. The ESP is at /efi, not /boot, and tinshell-boot-refresh refuses to write the font unless /efi really is the mounted ESP.
The firmware also boots a unified kernel image from /efi/EFI/Linux/arch.efi, which tinshell-boot-refresh rebuilds alongside the initramfs: etc/dracut-uki/uki.conf and etc/dracut-uki/cmdline configure it, usr/local/sbin/uki-rebuild builds it into that path, and etc/pacman.d/hooks/95-uki-rebuild.hook runs the builder after a kernel update. The image carries no initramfs keyfile, so the passphrase is asked by the tinshell splash, and it leaves the encrypted /boot images and their keyfile alone so the GRUB entry stays a working fallback. efi/grub/bgrt-splash.bmp is the firmware logo frame, kept so the embedded splash can be put back and used by tinshell-boot-refresh as the source of the splash's frame; uki.conf does not name it, so the boot stub draws nothing and clears nothing, and the frame the firmware leaves on the panel stays there until the tinshell splash commits a display of its own — a buffer painted with that same frame first, so the commit replaces the picture with the same picture. That commit happens on simpledrm, because etc/dracut.conf.d/zz-tinshell-splash.conf keeps amdgpu out of every boot image: simpledrm's commit copies pixels into the firmware's memory and cannot reprogram the panel, whereas a commit on amdgpu does reprogram it and blanks the screen. amdgpu is loaded by udev later, from the real root, after the root volume is unlocked; what the panel shows at that moment has not been measured, and neither command line's amdgpu.seamless=1 has been shown to preserve it.
Enabled on this machine without being listed above, so a rebuild must turn them on by hand if it wants them: user scope pipewire.socket, pipewire-pulse.socket, wireplumber.service, gnome-keyring-daemon.socket, p11-kit-server.socket, xdg-user-dirs.service; system scope NetworkManager.service (+dispatcher, +wait-online), bluetooth.service, cups.path/.service/.socket, avahi-daemon.service, firewalld.service, greetd.service, tlp.service, fstrim.timer, getty@.service, systemd-homed.service (+activate), systemd-timesyncd.service, systemd-userdbd.socket, remote-fs.target.
