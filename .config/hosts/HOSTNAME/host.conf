# ~/.config/hosts/<host>/host.conf — a machine's declaration.
#
# One directory per machine under ~/.config/hosts/, named for the machine it
# declares: ~/.local/bin/host-apply reads `hostnamectl --static` and opens the
# directory of that name, refusing — and naming the directories that do exist —
# when there is none. The name belongs to the machine, so the tracked directory
# carries the placeholder name HOSTNAME and this machine's name is a local
# symlink to it, created by .github/scripts/dotfiles-install.sh and ignored by
# git because it holds no content of its own. Renaming the tracked directory
# means renaming that link.
#
# Read by ~/.local/bin/host-apply, which enables the units listed below and
# installs the files under root/ at the absolute paths they mirror. One
# directory per machine under ~/.config/hosts/; a host's file never refers to
# another host's, so a machine's whole directory can differ without either
# file knowing about the other.
#
# Sections (a full-line `#` or `;` comment is the only comment form):
#   [units-user]    one unit to `systemctl --user enable`, named in full
#   [units-system]  one unit to `sudo systemctl enable`, named in full
#   [roots]         <path relative to root/> = <octal mode>; installed to /<path>
#   [notes]         free text printed by host-apply; no effect on the plan

# The units this machine enabled deliberately. The repository carries unit FILES
# but not their enablement links, so this list is the only record of what a
# rebuild must re-enable. Units that are installed but deliberately off are
# recorded in [notes] instead of being enabled here, and [notes] also names the
# units this machine has enabled without being listed above.
[units-user]
tinshell-shell.service
tinshell-warm.service
auto-rotate.service
awww-daemon.service
wallpapers-apply.service
wallpaper-cycle.timer
pi-patch-apply.path
pi-patch-apply.service
mpris-proxy.service

[units-system]
bluetooth-disable-before-sleep.service
tlp-pd.service

# Root-scoped sources. These cannot be committed at their real /etc or
# /usr/local paths, so they live here and host-apply installs them. The path is
# relative to this host's root/ directory and mirrors the destination.
[roots]
etc/systemd/system/bluetooth-disable-before-sleep.service = 0644
etc/systemd/logind.conf.d/10-inhibit-delay.conf = 0644
usr/local/sbin/bt-sleep.sh = 0755

[notes]
auto-rotate.service is this machine's convertible rotation: it drives the accelerometer (iio-sensor-proxy) and the SW_TABLET_MODE switch, so a machine without those devices must not enable it.
tinshell-shell.service and tinshell-warm.service are also installed and enabled by /home/tinoy/dev/tinshell/setup.sh, which owns the tinshell units; either path enables them.
Installed here but deliberately NOT enabled: amdgpu-watch.service, tinshell-promptd.service, tinshell-portal.service, tinshell-polkit.service. tinshell-islands-fallback.service is static — it is tinshell-shell.service's OnFailure target and is never enabled directly.
swaync.service is a mask (symlink to /dev/null) and is not an enable target. The masked system unit nvidia-powerd.service is outside this declaration.
pi-patch-apply.path and pi-patch-apply.service are enabled, but the applier script and the npm tree they act on live under ~/.pi/, which the repository does not carry: on a restored machine the units exist and fail until that tooling is restored.
wallpapers-apply.service and wallpaper-cycle.timer depend on awww-daemon.service; wallpaper-cycle.service is static and is pulled in by the timer.
The two root-scoped pieces above are specific to this machine: the Bluetooth before-sleep service preserves the radio's powered state across suspend, and the logind drop-in raises InhibitDelayMaxSec so the session lock lands before suspend.
Enabled on this machine without being listed above, so a rebuild must turn them on by hand if it wants them: user scope pipewire.socket, pipewire-pulse.socket, wireplumber.service, gnome-keyring-daemon.socket, p11-kit-server.socket, xdg-user-dirs.service; system scope NetworkManager.service (+dispatcher, +wait-online), bluetooth.service, cups.path/.service/.socket, avahi-daemon.service, firewalld.service, greetd.service, tlp.service, fstrim.timer, getty@.service, systemd-homed.service (+activate), systemd-timesyncd.service, systemd-userdbd.socket, remote-fs.target.
