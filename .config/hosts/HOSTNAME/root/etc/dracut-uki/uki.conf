# Additive: the drop-ins in /etc/dracut.conf.d are still read, which is what
# carries plymouth and the resume module into this image. Only the overrides
# below are specific to it.
# Files, not globs: remove_items expands to a quoted rm path, so a trailing
# * would be taken literally.
uefi="yes"
# No uefi_splash_image: with one, the boot stub fills the whole panel black and repaints
# the firmware's last frame in the same place; without one the stub returns before drawing
# anything, so the firmware frame stays until the tinshell splash commits its own picture —
# which it does on simpledrm, because zz-tinshell-splash.conf keeps amdgpu out of the image.
compress="zstd"
omit_drivers+=" nvidia nvidia_drm nvidia_modeset nvidia_uvm nouveau "
remove_items+=" /usr/lib/firmware/nvidia /etc/cryptsetup-keys.d/cryptroot.key "
