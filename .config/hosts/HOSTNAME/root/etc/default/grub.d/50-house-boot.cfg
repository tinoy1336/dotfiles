# The house boot screen. grub-mkconfig sources /etc/default/grub first and this directory
# after it, so these values are the ones the menu is built from.
#
# The menu keeps its zero-second hidden timeout: grub's own run_menu() returns the default
# entry without displaying anything when the timeout is 0, so the theme beside this
# machine's declaration is loaded and left dormant, and is drawn only when the menu is
# interrupted. GRUB_FONT is the face GRUB's console is drawn in — including the passphrase
# prompt for the encrypted root volume — and it names a file on the ESP for that reason:
# grub-mkconfig emits the cryptomount that opens the root volume while preparing the device
# a font is read from, so a font on the encrypted volume puts the prompt back on the
# firmware's own text output, over the vendor logo, in the size the firmware draws. The
# file is generated by house-boot-refresh, whose family and size the theme names too.
#
# GRUB_CMDLINE_LINUX_DEFAULT replaces the line of the same name in /etc/default/grub rather
# than adding to it, so the quiet console and the splash are stated together here. The
# encrypted-root arguments are not touched: they live in GRUB_CMDLINE_LINUX, which nothing
# here sets.
GRUB_TIMEOUT=0
GRUB_TIMEOUT_STYLE=hidden
GRUB_FONT="/efi/grub/fonts/house-32.pf2"
GRUB_THEME="/boot/grub/themes/house/theme.txt"
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=0 splash"
