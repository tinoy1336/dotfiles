# glibc's adaptive mmap threshold raises itself as soon as one large block is
# freed (up to 32 MB), after which every decoded image — media stills, clipboard
# thumbnails, previews — is served from the brk heap and NEVER returned to the
# OS: the shell's RSS then only ever climbs. Pinning the threshold and trimming
# aggressively makes freed image buffers go back to the kernel.
[Service]
Environment=MALLOC_MMAP_THRESHOLD_=131072
Environment=MALLOC_TRIM_THRESHOLD_=131072
Environment=MALLOC_TOP_PAD_=0
