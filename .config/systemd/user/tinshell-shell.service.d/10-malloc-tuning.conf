# Shell allocator tuning. Three properties are wanted at once: image-sized
# buffers go back to the kernel the moment they are freed; the heap is not
# shrunk and re-grown around every free; and the allocator does not duplicate
# its free lists across arenas.
#
# MALLOC_MMAP_THRESHOLD_ pins the request size above which an allocation is
# mmap'd rather than taken from the brk heap. An mmap'd block is unmapped on
# free, so decoded images, thumbnails and media stills return immediately.
# Unpinned, glibc raises this threshold as soon as one large block is freed
# (up to 32 MB), after which those buffers arrive from the heap and stay there.
#
# MALLOC_TRIM_THRESHOLD_ is how much free space must pile up at the top of the
# heap before glibc gives it back with sbrk/munmap; MALLOC_TOP_PAD_ is how much
# it keeps anyway, so the next allocation does not have to grow the heap again.
# At 128 KB and 0 the two fight: each free of a top-adjacent chunk shrinks the
# heap and the next allocation grows it back, which is churn visible as
# allocations stalling while the heap is resized. The pad is applied to EVERY
# brk growth, and every thread arena grows at least once — so its cost is paid
# per arena rather than per process. At 4 MB the shell ran 24 arenas of which 23
# held 4 MB with about 3.8 MB of it unused: roughly 88 MB of heap held and never
# touched, against 65 MB of genuinely allocated data in the whole process. 1 MB
# keeps the hysteresis the thrash argument needs at a quarter of that cost.
#
# MALLOC_ARENA_MAX is deliberately NOT set. A free arena is released whole once
# its threads go quiet, so an unfixed count lets the process shed a heap it no
# longer uses; and GLib spawns children through posix_spawn on this system,
# which does not copy page tables, so the fork-cost argument for a low cap does
# not apply. Capping it also costs thread scaling: 64 allocating threads reach
# 3.4 M allocations/s at a cap of 2 against 25 M/s uncapped.
#
# GTK_A11Y=none: without it GTK builds an AT-SPI context for every widget it
# creates, and the accessibility tree references the widgets, so a closed
# window's row trees are never finalised. Measured on a files-browser
# open/close cycle: 17,000 GObject instances created and not released per
# cycle, exactly the types a widget owns. Accessibility is off in this session
# anyway, so the bridge buys nothing and costs the whole row tree.
[Service]
Environment=GTK_A11Y=none
Environment=MALLOC_MMAP_THRESHOLD_=131072
Environment=MALLOC_TRIM_THRESHOLD_=8388608
Environment=MALLOC_TOP_PAD_=1048576
