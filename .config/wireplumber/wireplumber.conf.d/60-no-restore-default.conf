# Disable WirePlumber's stale default-target restore.
# WP's find-stored hook boosts previously-configured fallback devices
# (+20001 - rank) above the bluez_output session priority 1200 from
# 50-bt-default.conf, so internal speakers (1009) always beat a connected
# BT device. With restore disabled, default selection falls to pure
# priority.session: any connected BT device (1200) auto-beats internal
# (1009); internal becomes default when no BT device is present.
wireplumber.settings = {
  node.restore-default-targets = false
}
