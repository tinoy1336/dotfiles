# The volume a sink is given the first time its route is used.
#
# WirePlumber stores the volume and mute of every device route in its state
# directory (~/.local/state/wireplumber/default-routes) and restores them when
# the route is restored, which is what gives each device its own remembered
# level. That restore runs after the monitor's rules — device/apply-route-props
# precedes device/apply-routes — so a rule reaches only a route with nothing
# stored: this setting is the value such a route is given, and the only one it
# ever takes from configuration.
#
# The field is the cubic-scale amplitude, not a percentage: the shipped schema
# default in /usr/share/wireplumber/wireplumber.conf is 0.064, which WirePlumber
# documents as 0.4 ^ 3 (40% on the cubic scale). 0.008 is 20% as wpctl and the
# desktop report it.
#
# It is the baseline for every device-route sink, wired included, so it is not
# Bluetooth policy and is numbered 10, ahead of the Bluetooth fragments beside
# it (50-bt-default.conf, 70-*), which do not decide a volume.
wireplumber.settings = {
  device.routes.default-sink-volume = 0.008
}
