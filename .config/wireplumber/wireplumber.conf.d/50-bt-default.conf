# Bluetooth audio = DEFAULT output.
# ANY bluez_output sink gets top session priority, so on connect it beats the
# internal speakers for the default slot; on disconnect WirePlumber falls back
# to the internal sink automatically. This is the ONE default-sink mechanism on
# this machine — no pipewire-pulse module-switch-on-connect alongside it.
#
# The headset whose connect-time volume of 30% is pinned below is named by its
# Bluetooth address, written AA:BB:CC:DD:EE:FF in a comment and in WirePlumber's
# underscore form AA_BB_CC_DD_EE_FF inside the two matchers. Both are
# PLACEHOLDERS: fill in the address of the paired device, or let the installer
# substitute it, and the volume-pinning rules below start matching.
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~^bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1200
      }
    }
  }
  {
    matches = [
      {
        node.name = "~^bluez_output.AA_BB_CC_DD_EE_FF.*"
      }
    ]
    actions = {
      update-props = {
        volume = 0.3
      }
    }
  }
  {
    matches = [
      {
        device.name = "~^bluez_card.AA_BB_CC_DD_EE_FF$"
      }
    ]
    actions = {
      update-props = {
        device.routes.default-sink-volume = 0.3
      }
    }
  }
]
