# Bluetooth audio = DEFAULT output.
# ANY bluez_output sink gets top session priority, so on connect it beats the
# internal speakers for the default slot; on disconnect WirePlumber falls back
# to the internal sink automatically. This is the ONE default-sink mechanism on
# this machine — no pipewire-pulse module-switch-on-connect alongside it.
#
# This rule names no device, so it is the same on every machine. The volume one
# headset connects at is the single per-machine value in this directory: the
# tracked template 70-bt-headset-local.conf.in holds its shape, and the
# rendered neighbour it names — which git does not carry — holds the address.
# Fragments append to a rule array in name order, so those device rules are
# evaluated after this one.
monitor.bluez.rules = [
  {
    matches = [
      {
        node.name = "~^bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1200
      }
    }
  }
]
