# Proton Pass vault session (pass-cli) — local key store for the session database.
# The keyring backend defaults to the KERNEL keyring on Linux, which is cleared at
# reboot; pass-cli then finds local data with no key and forces a logout, so the
# vault session would not survive a reboot. The filesystem backend keeps the key in
# ~/.local/share/proton-pass-cli/.session/local.key (mode 600).
# EVERY pass-cli invocation must use the same backend: a different one cannot
# decrypt the existing database and forces that same logout.
PROTON_PASS_KEY_PROVIDER=fs
