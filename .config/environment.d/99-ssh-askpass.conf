# SSH_ASKPASS — themed passphrase prompts via promptd (ssh-askpass-promptd,
# yad fallback). REQUIRE=force makes ALL ssh passphrase prompts (including
# interactive terminal sessions) use the window; remove that line to limit
# askpass to non-tty contexts.
SSH_ASKPASS=/home/tinoy/.local/bin/ssh-askpass-promptd
SSH_ASKPASS_REQUIRE=force
