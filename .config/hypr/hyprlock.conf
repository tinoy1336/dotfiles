# The colours come from the palette, rendered beside this file by the palette
# renderer: the sourced file defines the $house_lock_* variables this file uses,
# so no colour value is written here. Keep the source line first — a variable is
# read where it is used.
source = ./hyprlock.colours.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    color = $house_lock_background
}

label {
    monitor =
    text = $TIME12
    color = $house_lock_clock
    font_size = 72
    font_family = Sans
    position = 0, 160
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $house_lock_identity
    font_size = 18
    font_family = Sans
    position = 0, 84
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 56
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = $house_lock_input_outline
    inner_color = $house_lock_input_fill
    font_color = $house_lock_input_text
    fail_color = $house_lock_fail
    check_color = $house_lock_check
    placeholder_text = <i>Password</i>
    fade_on_empty = false
    rounding = 8
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $FAIL
    color = $house_lock_fail
    font_size = 14
    font_family = Sans
    position = 0, -52
    halign = center
    valign = center
}
