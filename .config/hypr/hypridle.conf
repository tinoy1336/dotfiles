general {
    # TEMPORARY (stale-lock-frame diagnosis): the lock runs through the trace
    # wrapper, which starts the same bundle with WAYLAND_DEBUG + GDK_DEBUG=frames and
    # appends the filtered frame/commit traffic to its log. Both live under ~/.cache,
    # not /tmp, because this line runs for every lock — a reboot would empty /tmp and
    # leave the lock command pointing at nothing. Revert to the plain command when the
    # diagnosis closes:
    # TINSHELL_GREETER_MODE=lock /home/tinoy/dev/tinshell/apps/greeter/dist/tinshell-lock.sh
    lock_cmd = pgrep -f '[t]inshell-lock[.]js' || /home/tinoy/.cache/tinshell-lock-trace/tinshell-lock-trace.sh
    before_sleep_cmd = loginctl lock-session
    # `resume`, not `on`: a plain on is a no-op (m_dpmsStatus is already on) and the
    # resume produced no damage, so clients holding an unanswered frame request stayed
    # frozen until unrelated input arrived.
    after_sleep_cmd = /home/tinoy/.local/bin/hypr-dpms resume
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
    inhibit_sleep = 3
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = /home/tinoy/.local/bin/hypr-dpms off
    on-resume = /home/tinoy/.local/bin/hypr-dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
