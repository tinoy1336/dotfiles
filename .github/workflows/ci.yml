# Seven checks over the tracked set. Each job runs a script from .github/scripts,
# so the same run is available locally before a commit.
#
#   shellcheck          every tracked shell script, with the findings the tree
#                       already carries recorded in shellcheck-allowlist.txt
#   secrets             gitleaks over the tracked files and the whole history —
#                       a leak belongs at push time, not in a reader's browser
#   restore-rehearsal   a bare clone into a scratch HOME, then verification that
#                       the committed set actually rebuilds a home directory
#   installer           the installer run into a scratch home: what it wrote,
#                       what a second run does, what it refuses to touch, and
#                       that ./install.sh exists, is executable and forwards
#                       to the installer it names
#   portability         the path references in the tracked set: no file may name
#                       a home the reader does not have, or a checkout path the
#                       README does not document. Prose is read here — the other
#                       jobs select files by extension and never open a README
#   boundary            the membership of the tracked set: the shell's unit files
#                       and the promptd clients it links into ~/.local/bin belong
#                       to that project and its setup.sh, so a path from that set
#                       appearing here again fails. Every other job reads a file's
#                       content; this one reads whether the file is carried at all
#   palette             every file rendered from the house palette: each template
#                       is re-rendered and compared, and the run fails when a
#                       committed file or its record is stale, or when the palette
#                       is no longer the revision this repository rendered against
#
# The tool versions are pinned and their tarballs are checked against a digest:
# the local run and the CI run then lint the same scripts with the same shellcheck.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck 0.10.0
        run: |
          curl -sSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
      - name: Lint the tracked shell scripts
        run: .github/scripts/shellcheck.sh /tmp/shellcheck-v0.10.0/shellcheck

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      # The full history: a file deleted in a later commit is still readable in
      # the one that added it, and gitleaks only sees what the clone carries.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.28.0
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan the repository and its history
        run: .github/scripts/secrets-scan.sh /tmp/gitleaks

  restore-rehearsal:
    name: restore-rehearsal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rehearse a restore into a scratch home
        run: .github/scripts/restore-rehearsal.sh .

  installer:
    name: installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A forwarder that points at nothing is invisible until the day it is
      # needed, so the entry point is checked before anything else runs.
      - name: The root entry point exists and is executable
        run: test -x ./install.sh
      - name: Install into a scratch home and check what the installer promises
        run: .github/scripts/installer-smoke.sh .

  portability:
    name: portability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Path references resolve for a reader
        run: .github/scripts/portability.sh

  boundary:
    name: boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The tracked set carries no path the shell owns
        run: .github/scripts/boundary-check.sh

  palette:
    name: palette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The renderer belongs to the palette repository, which is public, and is not
      # vendored here — the rendered files and their templates are all that travel.
      # Its default branch is fetched rather than a pinned commit, because the
      # gate's own --expect-palette is what reports that the palette moved: a clone
      # held at a fixed revision would hide exactly the change this job exists for.
      - uses: actions/checkout@v7
        with:
          repository: tinoy1336/house-palette
          path: .palette-renderer
      # Node runs the renderer's sources by stripping the types, so the version is
      # pinned rather than left to the runner image.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Re-render every palette file and compare it
        run: .github/scripts/palette-check.sh .palette-renderer/bin/render
